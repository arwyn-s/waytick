# waytick: Hyprland keybind (classic hyprland.conf syntax).
# Opens the rofi prompt: presets, or type "25m", "25m @+1m", "1h30m @14:00".
bind = SUPER ALT, T, exec, ~/.config/rofi/launchers/waytick.sh

# Optional direct presets, no prompt:
# bind = SUPER ALT, P, exec, ~/.local/bin/waytick start 25m
# bind = SUPER ALT, SPACE, exec, ~/.local/bin/waytick toggle
