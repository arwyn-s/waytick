# waytick: systemd drop-in for optional settings.
# Install with:  systemctl --user edit waytick   (paste this), or copy to
#   ~/.config/systemd/user/waytick.service.d/override.conf
# then:          systemctl --user restart waytick
[Service]
# Sound played (via paplay) when a timer finishes.
Environment=WAYTICK_SOUND=/usr/share/sounds/freedesktop/stereo/alarm-clock-elapsed.oga
